<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tomás Roa Arenas — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />

<body>

  <!-- ── NAV ───────────────────────────────────── -->
  <nav>
    <span class="nav-logo"><span>TRA</span> / Portfolio</span>
    <ul class="nav-links">

    </ul>
  </nav>

  <section class="hero">

      <button class="tab-btn active" data-tab="graphic-design">Graphic Design</button>

    <div id="tab-filmmaking"     class="tab-panel"></div>
    <div id="tab-photography"    class="tab-panel"></div>
    <div id="tab-misc"           class="tab-panel"></div>

  <span class="contact">Email: <a href="">photos.tomas@gmail</a>
    <span>      ·      </span>
  <span class="contact">Instagram<a href="https://www.instagram.com/roa.creative">@roa.creative</a>

  <footer id="contact">

    <span>© 2026 Tomás Roa Arenas</span>
    <span>Design · Film · Photography</span>
  </footer>

  <!-- ── SCRIPTS ───────────────────────────────── -->
  <script src="graphic-design.js"></script>
  <script src="filmmaking.js"></script>
  <script src="photography.js"></script>
  <script src="misc.js"></script>
